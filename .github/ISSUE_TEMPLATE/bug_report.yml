name: Bug report
description: Something in the desktop app doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security vulnerabilities go to security@cipherline.chat, not here** (see SECURITY.md).
        Please don't paste message content, keys, tokens, or other people's usernames.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → Advanced → App version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux (AppImage)
        - Linux (.deb)
        - Built from source
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 24H2, macOS 15.5, Ubuntu 24.04
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or a screen recording help a lot for UI problems. Check them for private content first.
