name: OpenSSF Scorecard

# Supply-chain checks from OpenSSF Scorecard (https://scorecard.dev). Results are published to the public Scorecard
# API (that is what the README badge reads) and to this repo's Security tab as code scanning alerts.
#
# This workflow builds and signs nothing, reads no secrets, and runs only on GitHub-hosted runners.
# Every action is pinned to a full commit SHA. Scorecard's API rejects published results from a workflow with
# top-level env/defaults, workflow-level write permissions, or steps outside its approved action list, so keep it
# this shape.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  # Re-score when branch protection changes, since it is one of the checks.
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # sign the published results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
