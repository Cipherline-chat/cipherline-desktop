name: OpenSSF Scorecard

# Supply-chain checks from OpenSSF Scorecard (https://scorecard.dev). Results are published to the public Scorecard
# API (that is what the README badge reads) and to this repo's Security tab as code scanning alerts.
#
# This workflow builds and signs nothing, reads no secrets, and runs only on GitHub-hosted runners.
# Every action is pinned to a full commit SHA. Scorecard's API rejects published results from a workflow with
# top-level env/defaults, workflow-level write permissions, or steps outside its approved action list, so keep it
# this shape.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  # Re-score when branch protection changes, since it is one of the checks.
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # sign the published results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
