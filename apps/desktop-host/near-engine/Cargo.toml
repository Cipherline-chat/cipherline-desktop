[package]
name = "cl-near-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Cipherline proximity sign-in / local transfer session engine (host side). Linked by the Tauri host and by the Electron near-helper."

[lib]
name = "cl_near_engine"
path = "src/lib.rs"

[features]
default = []
# Test kit (fake link server, phone-peer process kit). Never in a release build.
near-testkit = []

[dependencies]
cl-crypto = { path = "../vendor/cl-crypto" }
cl-near = { path = "../vendor/cl-near" }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
tiny_http = "0.12"
aes = "0.8"
ctr = "0.9"
ghash = "0.5"
url = "2"
regex = "1"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
# TLS via SChannel (the Windows certificate store); no C toolchain needed.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
windows-core = "0.62"
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Radios",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
# TEST ONLY: cl-near's loopback fence (two processes on one box).
cl-near = { path = "../vendor/cl-near", features = ["dangerous-loopback"] }
tempfile = "3"
