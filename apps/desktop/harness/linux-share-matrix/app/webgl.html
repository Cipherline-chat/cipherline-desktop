<!doctype html>
<html><head><meta charset="utf-8"><title>CL-MATRIX-WEBGL</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="256" height="256"></canvas>
<script>
// WebGL "does it actually DRAW" probe. Mirrors the onboarding dots engine (src/components/onboarding/dots/engine.ts):
// WebGL1, alpha + premultipliedAlpha, powerPreference high-performance, mediump fragment precision, gl.POINTS with gl_PointSize.
// "available" is not enough (an RTX 5070 tester has WebGL available and the dots draw nothing), so:
//   1. readPixels the drawing buffer           -> the GL pipeline drew
//   2. keep drawing onscreen; main capturePage() -> the compositor presented it (checked by main.js)
const VS = 'attribute vec2 p; uniform float s; void main(){ gl_Position = vec4(p,0.0,1.0); gl_PointSize = s; }';
const FS = 'precision mediump float; void main(){ gl_FragColor = vec4(1.0,0.0,0.5,1.0); }';
function sh(gl, t, src) { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(gl) { const p = gl.createProgram(); gl.attachShader(p, sh(gl, gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl, gl.FRAGMENT_SHADER, FS)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
function drawPoint(gl, size) {
  const p = prog(gl); gl.useProgram(p);
  gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(p, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1f(gl.getUniformLocation(p, 's'), size);
  gl.drawArrays(gl.POINTS, 0, 1);
}
function px(gl, x, y) { const o = new Uint8Array(4); gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, o); return Array.from(o); }
const near = (a, b, t = 6) => a.every((v, i) => Math.abs(v - b[i]) <= t);
window.runWebglProbe = function (kind) {
  const out = { kind };
  try {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const opts = kind === 'dots-webgl1'
      ? { antialias: false, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: 'high-performance' }
      : { preserveDrawingBuffer: true };
    const gl = c.getContext(kind === 'webgl2' ? 'webgl2' : 'webgl', opts);
    if (!gl) { out.available = false; return out; }
    out.available = true;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    out.renderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    out.vendor = ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    out.version = gl.getParameter(gl.VERSION);
    out.pointSizeRange = Array.from(gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE));
    out.maxTexture = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    drawPoint(gl, 64);
    // readPixels straight after the draw call, in the same task, is valid even without preserveDrawingBuffer.
    out.centerPixel = px(gl, 64, 64); out.cornerPixel = px(gl, 2, 2);
    out.drew = near(out.centerPixel, [255, 0, 128, 255]) && near(out.cornerPixel, [0, 0, 0, 0]);
  } catch (e) { out.error = String(e && e.message || e); }
  return out;
};
// Onscreen canvas: redraw every frame until main has captured the page.
window.startOnscreen = function () {
  const c = document.getElementById('c');
  const gl = c.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
  if (!gl) return false;
  (function loop() { drawPoint(gl, 128); requestAnimationFrame(loop); })();
  return true;
};
</script></body></html>
