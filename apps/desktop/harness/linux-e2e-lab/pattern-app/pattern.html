<!doctype html>
<html><head><meta charset="utf-8"><title>LAB-PATTERN</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Animated screen content (scrolling "document" + moving blocks + frame counter), one tick per requestAnimationFrame, and a
// pure sine tone at q.hz played through Web Audio (a different process tree from the Cipherline app under test).
const q = new URLSearchParams(location.hash.slice(1));
const W = +q.get('w') || 900, H = +q.get('h') || 900;
const c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d', { alpha: false });
const base = document.createElement('canvas'); base.width = W; base.height = H * 2;
{
  const t = document.createElement('canvas'); t.width = W; t.height = H; const x = t.getContext('2d');
  x.fillStyle = '#f2f3f5'; x.fillRect(0, 0, W, H);
  let seed = 12345; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let y = 16; y < H - 16; y += 22) { let px = 40; while (px < W - 120) { const ww = 18 + rnd() * 70; x.fillStyle = `rgb(${30 + rnd() * 80 | 0},${30 + rnd() * 80 | 0},${40 + rnd() * 90 | 0})`; x.fillRect(px, y, ww, 11); px += ww + 8; } }
  const b = base.getContext('2d'); b.drawImage(t, 0, 0); b.drawImage(t, 0, H);
}
let n = 0;
(function frame(now) {
  n = (n + 1) & 0xffffff;
  g.drawImage(base, 0, -((n * 3) % H));
  for (let k = 0; k < 4; k++) {
    let hue = (n * 4 + k * 60) % 360; if (hue > 130 && hue < 230) hue += 110;   // never the annotation stroke's teal (#25E0C8, hue 172): the lab counts those pixels
    g.fillStyle = `hsl(${hue % 360} 90% 55%)`;
    g.fillRect((Math.sin(n / 40 + k) * 0.5 + 0.5) * (W - 140), 40 + (Math.cos(n / 55 + k * 1.3) * 0.5 + 0.5) * (H - 220), 140, 140);
  }
  g.fillStyle = '#fff'; g.font = '40px monospace'; g.fillText(`#${n}`, 24, H - 28);
  requestAnimationFrame(frame);
})(0);
if (q.get('tone') === '1') {
  const hz = +q.get('hz') || 1000;
  const ac = new AudioContext({ sampleRate: 48000 });
  const o = ac.createOscillator(); o.frequency.value = hz; const gn = ac.createGain(); gn.gain.value = 0.25;
  o.connect(gn).connect(ac.destination); o.start();
  addEventListener('click', () => ac.resume());
  ac.resume();
}
</script></body></html>
