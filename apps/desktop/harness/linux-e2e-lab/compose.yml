# Linux e2e lab: a fully local, isolated server stack for two real Cipherline desktop clients.
#
# Its own compose project (`cle2e`), its own network (172.29.88.0/24), `cle2e-*` container names, tmpfs-only data and a
# single loopback-published port (the API, 127.0.0.1:13005). Nothing here touches cipherline-* containers, ports
# 3005/5174/7880/5432/6379/9000, the shared dev stack, staging or prod. No email leaves it: RESEND_API_KEY is unset, so
# the API logs verification / login codes to stdout and the driver reads them from `docker logs cle2e-api`.
#
# Shaped like harness/channel-keys/compose.yml (+ MinIO, LiveKit and the API itself). Variables come from out/lab.env,
# generated by up.sh (random secrets, gitignored).
name: cle2e
networks:
  lab:
    name: cle2e-net
    ipam:
      config:
        - subnet: 172.29.88.0/24
services:
  pg:
    image: postgres:15-alpine
    container_name: cle2e-pg
    environment: { POSTGRES_USER: cle2e, POSTGRES_PASSWORD: "${CLE2E_PG_PASS}", POSTGRES_DB: cle2e }
    command: ["postgres", "-c", "max_connections=100", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    tmpfs: [/var/lib/postgresql/data]
    networks: { lab: { ipv4_address: 172.29.88.10 } }
  redis:
    image: redis:7-alpine
    container_name: cle2e-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: { lab: { ipv4_address: 172.29.88.11 } }
  minio:
    image: minio/minio:latest
    container_name: cle2e-minio
    command: ["server", "/data"]
    environment: { MINIO_ROOT_USER: cle2e, MINIO_ROOT_PASSWORD: "${CLE2E_MINIO_PASS}" }
    tmpfs: [/data]
    networks: { lab: { ipv4_address: 172.29.88.12 } }
  livekit:
    # Same pin as the dev stack / share-hold-run.mjs. node_ip is the container's own address on the lab network, so the
    # two client containers reach media directly (UDP 7882 / TCP 7881), exactly as a LAN client reaches the dev box.
    image: livekit/livekit-server:v1.9.12
    container_name: cle2e-livekit
    command: ["--config", "/etc/livekit.yaml"]
    environment: { LIVEKIT_KEYS: "${CLE2E_LK_KEY}: ${CLE2E_LK_SECRET}" }
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    networks: { lab: { ipv4_address: 172.29.88.13 } }
  api:
    image: cle2e-desktop
    container_name: cle2e-api
    user: "1001:1001"
    working_dir: /api
    command: ["/node/bin/node", "/api/main.js"]
    ports: ["127.0.0.1:13005:3005"]
    depends_on: [pg, redis, minio, livekit]
    volumes:
      - "${CLE2E_NODE_DIR}:/node:ro"
      - "./out/api:/api:ro"
      - "/home/antigravity/Cipherline:/home/antigravity/Cipherline:ro"
    environment:
      NODE_ENV: development
      NODE_PATH: "/api/node_modules:/home/antigravity/Cipherline/apps/api/node_modules:/home/antigravity/Cipherline/node_modules"
      PORT: "3005"
      DB_HOST: 172.29.88.10
      DB_PORT: "5432"
      DB_USER: cle2e
      DB_PASS: "${CLE2E_PG_PASS}"
      DB_NAME: cle2e
      DB_POOL_MAX: "20"
      REDIS_HOST: 172.29.88.11
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: http://172.29.88.12:9000
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: cle2e
      MINIO_SECRET_KEY: "${CLE2E_MINIO_PASS}"
      MINIO_PUBLIC_ENDPOINT: ""
      LIVEKIT_API_KEY: "${CLE2E_LK_KEY}"
      LIVEKIT_API_SECRET: "${CLE2E_LK_SECRET}"
      # What the CLIENT is told. Each client container runs a loopback proxy on 127.0.0.1:13005 (inside/lab-proxy.mjs) that
      # sends /rtc* to LiveKit and everything else to the API: the renderer's CSP (connect-src) only allows the VITE_API_HOST
      # loopback origin, so signalling must share that origin. Media (UDP/TCP) goes straight to node_ip.
      LIVEKIT_URL: ws://127.0.0.1:13005
      INTERNAL_LIVEKIT_URL: http://172.29.88.13:7880
      JWT_SECRET: "${CLE2E_JWT}"
      JWT_2FA_SECRET: "${CLE2E_JWT2}"
      MIN_CLIENT_VERSION: 0.0.0
      CLIENT_ATTEST_SECRETS: ""
      REGISTER_POW_DIFFICULTY: "0"
      METRICS_COLLECTOR_ENABLED: "false"
      PUBLIC_DOMAIN: localhost
      INFRA_SAMPLER_ENABLED: "false"
      RESEND_API_KEY: ""
    networks: { lab: { ipv4_address: 172.29.88.14 } }
