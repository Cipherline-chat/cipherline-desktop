<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cipherline</title>
    <!--
      Brand fonts: fetched early but NEVER blocking. src/utils/webFonts.ts
      applies this stylesheet from script; a preload is not render- or
      script-blocking, so a slow/unreachable Google (e.g. right after the PC
      wakes) can no longer hold the window blank. Keep the URL identical to
      WEB_FONTS_CSS_URL so the preload is reused.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    <!--
      CSP is set via HTTP response headers by the local HTTP server (production)
      or the onHeadersReceived hook (dev). No meta tag — having both causes
      the browser to enforce the intersection of both policies (most restrictive),
      which blocks Google Fonts and other allowed third-party resources.
    -->
  </head>
  <body>
    <!--
      Instant first paint: the loading screen's own backdrop (same gradient as
      .lo-root in src/styles/app-loading.css), drawn by the browser the moment
      this HTML and the stylesheet are parsed — before any script has even been
      evaluated. React replaces it on its first render (normally with that same
      loading screen, so there is no visible change), instead of the window
      sitting blank until the whole app bundle has been compiled and run.
    -->
    <div id="root"><div aria-hidden="true" style="position:fixed;inset:0;background:linear-gradient(180deg,#131A30 0%,#0F1526 45%,#0B0F1E 100%)"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
